<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vignesh Portfolio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
 <style>
body{
margin:0;
font-family:'Poppins',sans-serif;
background:#30107;
color:white;
overflow-x:hidden;
background:
radial-gradient(circle at top left,#ff007f22,transparent 40%),
radial-gradient(circle at bottom right,#00f0ff22,transparent 40%),
#030107;
}
.container{
max-width:1200px;
margin:auto;
padding:40px 20px;
}

.card{
background:rgba(255,255,255,.03);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.08);
border-radius:25px;
padding:30px;
margin-bottom:30px;
box-shadow:
0 0 30px rgba(0,240,255,.08),
0 0 30px rgba(255,0,127,.05);
}

h1,h2{
font-family:'Orbitron',sans-serif;
}

h1{
font-size:40px;
background:linear-gradient(
45deg,
#ff007f,
#00f0ff
);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

h2{
color:#00f0ff;
margin-bottom:20px;
}

.profile-wrapper{
display:flex;
justify-content:center;
margin-bottom:25px;
}

#profileImage{
width:230px;
height:230px;
border-radius:50%;
object-fit:cover;
padding:5px;
background:
linear-gradient(
135deg,
#ff007f,
#00f0ff
);
box-shadow:
0 0 35px #00f0ff55;
}

#aboutContent{
line-height:1.8;
color:#c7c3dc;
font-size:15px;
text-align:center;
}

#skillsContainer{
display:flex;
flex-wrap:wrap;
gap:12px;
margin-top:15px;
}

.skill{
padding:10px 18px;
border-radius:30px;
border:1px solid #00f0ff;
color:#00f0ff;
transition:.3s;
}

.skill:hover{
background:#00f0ff;
color:black;
transform:translateY(-3px);
}

.grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(280px,1fr));
gap:25px;
}

.item{
background:rgba(255,255,255,.02);
border:1px solid rgba(255,255,255,.08);
border-radius:18px;
overflow:hidden;
transition:.3s;
}

.item:hover{
transform:translateY(-8px);
box-shadow:
0 0 20px rgba(0,240,255,.25);
}

.item img{
width:100%;
height:220px;
object-fit:cover;
}

.item h3{
padding:15px 15px 5px;
color:#00f0ff;
}

.item p{
padding:0 15px 20px;
color:#b8b3cf;
line-height:1.6;
}

.contact-card{
display:flex;
flex-wrap:wrap;
gap:20px;
}

.contact-btn{
display:flex;
align-items:center;
justify-content:center;
padding:15px;
border-radius:15px;
text-decoration:none;
color:white;
border:1px solid #00f0ff55;
transition:.3s;
}

.contact-btn:hover{
background:#00f0ff;
color:black;
}

@media(max-width:768px){

#profileImage{
width:180px;
height:180px;
}

h1{
font-size:30px;
}

}
html{
scroll-behavior:smooth;
}

.navbar{
position:fixed;
top:0;
left:0;
width:100%;
background:#0b0818;
padding:15px;
display:flex;
justify-content:center;
gap:30px;
z-index:999;
border-bottom:1px solid rgba(0,240,255,.3);
}

.navbar a{
color:white;
text-decoration:none;
font-weight:bold;
}

.navbar a:hover{
color:#00f0ff;
}

.container{
margin-top:80px;
}
 .skill-card{
margin-bottom:20px;
}

.skill-header{
display:flex;
justify-content:space-between;
margin-bottom:8px;
font-weight:bold;
color:white;
}

.progress-bar{
width:100%;
height:12px;
background:#111827;
border-radius:30px;
overflow:hidden;
}

.progress-fill{
height:100%;
background:linear-gradient(
90deg,
#ff007f,
#00f0ff
);
border-radius:30px;
box-shadow:0 0 15px #00f0ff;
}

</style>
</head>
<body>
 <nav class="navbar">
    <a href="#home">Home</a>

</nav>

</div>
 <div class="card" id="about">

</div>

<script>
const supabaseUrl="https://gpevmkcqahutzbrjiqrx.supabase.co";
const supabaseKey="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdwZXZta2NxYWh1dHpicmppcXJ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMjEyMjMsImV4cCI6MjA5NjU5NzIyM30.3vPDMgzPgjH-DJWexhy4-uxROyFTxCyS6cv2DbW-g_Q";
const supabaseClient=window.supabase.createClient(supabaseUrl,supabaseKey);

async function loadPortfolio(){

const {data:about}=await supabaseClient.from("about_me").select("*").single();
if(about){
 document.getElementById("aboutContent").innerText=about.content||"";
 document.getElementById("profileImage").src=about.image_url||"";
}

const {data:skills}=await supabaseClient
.from("skills")
.select("*");

const skillsDiv=
document.getElementById(
"skillsContainer"
);

skillsDiv.innerHTML="";

(skills||[]).forEach(s=>{

skillsDiv.innerHTML += `

<div class="skill-card">

<div class="skill-header">

<span>${s.skill_name}</span>

<span>${s.percentage}%</span>

</div>

<div class="progress-bar">

<div
class="progress-fill"
style="width:${s.percentage}%">
</div>

</div>

</div>

`;

});

const {data:projects}=await supabaseClient.from("projects").select("*").order("id",{ascending:false});
const projectDiv=document.getElementById("projectsContainer");
projectDiv.innerHTML="";
(projects||[]).forEach(p=>{
 projectDiv.innerHTML+=`
 <div class="item">
 <img src="${p.image_url||''}">
 <h3>${p.name}</h3>
 <p>${p.description||''}</p>
 </div>`;
});

const {data:certs}=await supabaseClient.from("certificates").select("*").order("id",{ascending:false});
const certDiv=document.getElementById("certificatesContainer");
certDiv.innerHTML="";
(certs||[]).forEach(c=>{
 certDiv.innerHTML+=`
 <div class="item">
 <img
src="${c.image_url||''}"
style="
width:100%;
cursor:pointer;
border-radius:10px;
"
onclick="window.open('${c.image_url}','_blank')">
 <h3>${c.created_name}</h3>
 <p>${c.description||''}</p>
 </div>`;
});
}
loadPortfolio();

</script>
 
</body>
</html>
