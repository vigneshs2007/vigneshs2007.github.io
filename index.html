<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vignesh Portfolio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#030107;color:white;font-family:Arial,sans-serif}
.container{max-width:1200px;margin:auto;padding:30px}
.card{background:#0b0818;border:1px solid #00f0ff33;border-radius:20px;padding:25px;margin-bottom:25px}
h1,h2{color:#00f0ff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.item{border:1px solid #ffffff22;padding:15px;border-radius:12px}
img{max-width:100%}
#profileImage{width:220px;height:220px;border-radius:50%;object-fit:cover}
.skill{display:inline-block;padding:8px 14px;margin:5px;border:1px solid #00f0ff;border-radius:20px}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h1>Vignesh Portfolio</h1>
<img id="profileImage" src="" alt="Profile">
<p id="aboutContent">Loading...</p>
</div>

<div class="card">
<h2>Skills</h2>
<div id="skillsContainer"></div>
</div>

<div class="card">
<h2>Projects</h2>
<div id="projectsContainer" class="grid"></div>
</div>

<div class="card">
<h2>Certificates</h2>
<div id="certificatesContainer" class="grid"></div>
</div>
</div>

<script>
const supabaseUrl="https://gpevmkcqahutzbrjiqrx.supabase.co";
const supabaseKey="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdwZXZta2NxYWh1dHpicmppcXJ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMjEyMjMsImV4cCI6MjA5NjU5NzIyM30.3vPDMgzPgjH-DJWexhy4-uxROyFTxCyS6cv2DbW-g_Q";
const supabaseClient=window.supabase.createClient(supabaseUrl,supabaseKey);

async function loadPortfolio(){

const {data:about}=await supabaseClient.from("about_me").select("*").single();
if(about){
 document.getElementById("aboutContent").innerText=about.content||"";
 document.getElementById("profileImage").src=about.image_url||"";
}

const {data:skills}=await supabaseClient.from("skills").select("*");
const skillsDiv=document.getElementById("skillsContainer");
skillsDiv.innerHTML="";
(skills||[]).forEach(s=>{
 skillsDiv.innerHTML+=`<span class="skill">${s.skill_name}</span>`;
});

const {data:projects}=await supabaseClient.from("projects").select("*").order("id",{ascending:false});
const projectDiv=document.getElementById("projectsContainer");
projectDiv.innerHTML="";
(projects||[]).forEach(p=>{
 projectDiv.innerHTML+=`
 <div class="item">
 <img src="${p.image_url||''}">
 <h3>${p.name}</h3>
 <p>${p.description||''}</p>
 </div>`;
});

const {data:certs}=await supabaseClient.from("certificates").select("*").order("id",{ascending:false});
const certDiv=document.getElementById("certificatesContainer");
certDiv.innerHTML="";
(certs||[]).forEach(c=>{
 certDiv.innerHTML+=`
 <div class="item">
 <img src="${c.image_url||''}">
 <h3>${c.created_name}</h3>
 <p>${c.description||''}</p>
 </div>`;
});
}
loadPortfolio();
</script>
</body>
</html>
