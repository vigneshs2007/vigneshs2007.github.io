<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1.0">

<title>
Vignesh Admin Dashboard
</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Orbitron',sans-serif;
}

body{

background:#030107;

color:white;

display:flex;

min-height:100vh;

overflow-x:hidden;

}

/* SIDEBAR */

.sidebar{

width:260px;

height:100vh;

position:fixed;

left:0;
top:0;

background:

rgba(8,4,18,.95);

border-right:

1px solid
rgba(0,240,255,.15);

padding:25px;

}

.sidebar h2{

text-align:center;

margin-bottom:30px;

color:#00f0ff;

}

.sidebar button{

width:100%;

padding:14px;

margin-bottom:12px;

background:

rgba(255,255,255,.03);

border:

1px solid
rgba(255,255,255,.08);

border-radius:10px;

cursor:pointer;

color:white;

transition:.3s;

}

.sidebar button:hover{

background:

rgba(0,240,255,.08);

border-color:

#00f0ff;

}

/* MAIN */

.main{

margin-left:260px;

padding:30px;

width:100%;

}

/* CARD */

.card{

background:

rgba(10,10,20,.9);

backdrop-filter:
blur(20px);

padding:25px;

border-radius:20px;

margin-bottom:25px;

border:

1px solid
rgba(0,240,255,.1);

box-shadow:

0 0 20px
rgba(0,240,255,.05);

}

.card h2{

margin-bottom:20px;

color:#00f0ff;

}

/* INPUTS */

input,
textarea{

width:100%;

padding:14px;

margin-top:10px;

background:#111827;

border:

1px solid
rgba(255,255,255,.08);

border-radius:10px;

color:white;

outline:none;

}

textarea{

resize:none;

}

input:focus,
textarea:focus{

border-color:#00f0ff;

}

/* BUTTON */

.primary-btn{

width:100%;

padding:14px;

margin-top:15px;

border:none;

border-radius:10px;

cursor:pointer;

font-weight:bold;

color:white;

background:

linear-gradient(
45deg,
#ff007f,
#00f0ff
);

}

.primary-btn:hover{

opacity:.9;

}

/* DELETE BUTTON */

.danger-btn{

background:red;

border:none;

padding:8px 12px;

border-radius:8px;

color:white;

cursor:pointer;

}

/* EDIT BUTTON */

.edit-btn{

background:#00f0ff;

border:none;

padding:8px 12px;

border-radius:8px;

cursor:pointer;

color:black;

margin-right:10px;

}

/* LIST ITEM */

.item-box{

background:

rgba(255,255,255,.03);

padding:15px;

border-radius:12px;

margin-top:10px;

display:flex;

justify-content:
space-between;

align-items:center;

}

/* PROFILE */

.profile-preview{

width:180px;

height:180px;

object-fit:cover;

border-radius:50%;

margin-top:20px;

border:

4px solid
#00f0ff;

}

/* PROJECT CARD */

.project-card{

background:

rgba(255,255,255,.03);

padding:15px;

border-radius:15px;

margin-top:15px;

}

.project-card img{

width:100%;

height:220px;

object-fit:cover;

border-radius:10px;

margin-bottom:10px;

}

/* CERTIFICATE CARD */

.certificate-card{

background:

rgba(255,255,255,.03);

padding:15px;

border-radius:15px;

margin-top:15px;

}

.certificate-card img{

width:100%;

height:220px;

object-fit:cover;

border-radius:10px;

margin-bottom:10px;

}

@media(max-width:900px){

.sidebar{

position:relative;

width:100%;

height:auto;

}

.main{

margin-left:0;

}

body{

flex-direction:column;

}

}

</style>

</head>

<body>

<div class="sidebar">

<h2>
ADMIN PANEL
</h2>

<button
onclick="showSection(
'profileSection'
)">
Profile
</button>

<button
onclick="showSection(
'aboutSection'
)">
About Me
</button>

<button
onclick="showSection(
'skillsSection'
)">
Skills
</button>

<button
onclick="showSection(
'projectsSection'
)">
Projects
</button>

<button
onclick="showSection(
'certificatesSection'
)">
Certificates
</button>

<button
onclick="logout()">
Logout
</button>

</div>

<div class="main">

<!-- PROFILE SECTION -->

<div
class="card section"
id="profileSection">

<h2>
Profile Image
</h2>

<input
type="file"
id="profile-input"
accept="image/*">

<button
class="primary-btn"
onclick="uploadProfileImage()">

Upload Profile Image

</button>

<img
id="profilePreview"
class="profile-preview">

</div>

<!-- ABOUT SECTION -->

<div
class="card section"
id="aboutSection"
style="display:none;">

<h2>
About Me
</h2>

<textarea
id="about-text"
rows="8"
placeholder="Enter About Me Content">
</textarea>

<button
class="primary-btn"
onclick="updateAbout()">

Save About

</button>

</div>

<!-- SKILLS SECTION -->

<div
class="card section"
id="skillsSection"
style="display:none;">

<h2>
Skills
</h2>

<input
type="text"
id="skillInput"
placeholder="Enter Skill">

<button
class="primary-btn"
onclick="addSkill()">

Add Skill

</button>

<div
id="skillsList">
</div>

</div>

<!-- PROJECTS SECTION -->

<div
class="card section"
id="projectsSection"
style="display:none;">

<h2>
Projects
</h2>

<h3>
Add New Project
</h3>

<input
type="text"
id="projectName"
placeholder="Project Name">

<textarea
id="projectDesc"
rows="5"
placeholder="Project Description">
</textarea>

<input
type="file"
id="projectImage"
accept="image/*">

<button
class="primary-btn"
onclick="addProject()">

Add Project

</button>

<hr
style="
margin:25px 0;
border-color:
rgba(255,255,255,.08);
">

<div
id="projectsList">
</div>

</div>

<!-- CERTIFICATES SECTION -->

<div
class="card section"
id="certificatesSection"
style="display:none;">

<h2>
Certificates
</h2>

<h3>
Add New Certificate
</h3>

<input
type="text"
id="certificateName"
placeholder="Certificate Name">

<textarea
id="certificateDesc"
rows="5"
placeholder="Certificate Description">
</textarea>

<input
type="file"
id="certificateImage"
accept="image/*">

<button
class="primary-btn"
onclick="addCertificate()">

Add Certificate

</button>

<hr
style="
margin:25px 0;
border-color:
rgba(255,255,255,.08);
">

<div
id="certificatesList">
</div>

</div>

</div>

<!-- MAIN END -->
<script>

/* ==========================
   SUPABASE CONFIG
========================== */

const supabaseUrl =
"https://gpevmkcqahutzbrjiqrx.supabase.co";

const supabaseKey =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdwZXZta2NxYWh1dHpicmppcXJ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMjEyMjMsImV4cCI6MjA5NjU5NzIyM30.3vPDMgzPgjH-DJWexhy4-uxROyFTxCyS6cv2DbW-g_Q";

const supabaseClient =
window.supabase.createClient(
supabaseUrl,
supabaseKey
);

/* ==========================
   AUTH CHECK
========================== */

async function checkAuth(){

const {
data:{session}
}
=
await supabaseClient
.auth
.getSession();

if(!session){

window.location.href =
"login.html";

return;

}

}

checkAuth();

/* ==========================
   SECTION SWITCH
========================== */

function showSection(id){

document
.querySelectorAll(".section")
.forEach(section=>{

section.style.display =
"none";

});

document
.getElementById(id)
.style.display =
"block";

}

/* ==========================
   LOGOUT
========================== */

async function logout(){

await supabaseClient
.auth
.signOut();

window.location.href =
"login.html";

}

/* ==========================
   PROFILE IMAGE
========================== */

async function uploadProfileImage(){

const file =
document
.getElementById(
"profile-input"
)
.files[0];

if(!file){

alert(
"Select Image"
);

return;

}

const fileName =
Date.now()
+
"-"
+
file.name;

const {error} =
await supabaseClient
.storage
.from(
"profile-images"
)
.upload(
fileName,
file
);

if(error){

alert(
error.message
);

return;

}

const {data} =
supabaseClient
.storage
.from(
"profile-images"
)
.getPublicUrl(
fileName
);

await supabaseClient
.from(
"about_me"
)
.update({

image_url:
data.publicUrl

})
.eq(
"id",
1
);

loadProfile();

alert(
"Profile Updated"
);

}

/* ==========================
   LOAD PROFILE
========================== */

async function loadProfile(){

const {data} =
await supabaseClient
.from(
"about_me"
)
.select("*")
.single();

if(data){

document
.getElementById(
"profilePreview"
)
.src =
data.image_url || "";

}

}

/* ==========================
   ABOUT
========================== */

async function loadAbout(){

const {data} =
await supabaseClient
.from(
"about_me"
)
.select("*")
.single();

if(data){

document
.getElementById(
"about-text"
)
.value =
data.content || "";

}

}

async function updateAbout(){

const content =
document
.getElementById(
"about-text"
)
.value;

await supabaseClient
.from(
"about_me"
)
.update({

content

})
.eq(
"id",
1
);

alert(
"About Updated"
);

}

/* ==========================
   SKILLS
========================== */

async function addSkill(){

const skill =
document
.getElementById(
"skillInput"
)
.value;

if(!skill){

return;

}

await supabaseClient
.from(
"skills"
)
.insert([{

skill_name:
skill

}]);

document
.getElementById(
"skillInput"
)
.value = "";

loadSkills();

}

async function deleteSkill(id){

await supabaseClient
.from(
"skills"
)
.delete()
.eq(
"id",
id
);

loadSkills();

}

async function editSkill(
id,
currentSkill
){

const newSkill =
prompt(
"Edit Skill",
currentSkill
);

if(!newSkill)
return;

await supabaseClient
.from(
"skills"
)
.update({

skill_name:
newSkill

})
.eq(
"id",
id
);

loadSkills();

}

async function loadSkills(){

const {data} =
await supabaseClient
.from(
"skills"
)
.select("*");

const list =
document
.getElementById(
"skillsList"
);

list.innerHTML = "";

data.forEach(skill=>{

list.innerHTML += `

<div class="item-box">

<span>
${skill.skill_name}
</span>

<div>

<button
class="edit-btn"
onclick="editSkill(
${skill.id},
'${skill.skill_name}'
)">

Edit

</button>

<button
class="danger-btn"
onclick="deleteSkill(
${skill.id}
)">

Delete

</button>

</div>

</div>

`;

});

}

/* ==========================
   PROJECTS
========================== */

async function addProject(){

const file =
document
.getElementById(
"projectImage"
)
.files[0];

let imageUrl = "";

if(file){

const fileName =
Date.now()
+
"-"
+
file.name;

await supabaseClient
.storage
.from(
"project-images"
)
.upload(
fileName,
file
);

const {data} =
supabaseClient
.storage
.from(
"project-images"
)
.getPublicUrl(
fileName
);

imageUrl =
data.publicUrl;

}

await supabaseClient
.from(
"projects"
)
.insert([{

name:
document.getElementById(
"projectName"
).value,

description:
document.getElementById(
"projectDesc"
).value,

image_url:
imageUrl

}]);

loadProjects();

}

async function deleteProject(id){

await supabaseClient
.from(
"projects"
)
.delete()
.eq(
"id",
id
);

loadProjects();

}

async function loadProjects(){

const {data} =
await supabaseClient
.from(
"projects"
)
.select("*")
.order(
"id",
{
ascending:false
}
);

const list =
document
.getElementById(
"projectsList"
);

list.innerHTML = "";

data.forEach(project=>{

list.innerHTML += `

<div class="project-card">

<img
src="${project.image_url}">

<h3>
${project.name}
</h3>

<p>
${project.description}
</p>

<br>

<button
class="danger-btn"
onclick="deleteProject(
${project.id}
)">

Delete

</button>

</div>

`;

});

}

/* ==========================
   CERTIFICATES
========================== */

async function addCertificate(){

const file =
document
.getElementById(
"certificateImage"
)
.files[0];

let imageUrl = "";

if(file){

const fileName =
Date.now()
+
"-"
+
file.name;

await supabaseClient
.storage
.from(
"certificate-images"
)
.upload(
fileName,
file
);

const {data} =
supabaseClient
.storage
.from(
"certificate-images"
)
.getPublicUrl(
fileName
);

imageUrl =
data.publicUrl;

}

await supabaseClient
.from(
"certificates"
)
.insert([{

created_name:
document.getElementById(
"certificateName"
).value,

description:
document.getElementById(
"certificateDesc"
).value,

image_url:
imageUrl

}]);

loadCertificates();

}

async function deleteCertificate(id){

await supabaseClient
.from(
"certificates"
)
.delete()
.eq(
"id",
id
);

loadCertificates();

}

async function loadCertificates(){

const {data} =
await supabaseClient
.from(
"certificates"
)
.select("*")
.order(
"id",
{
ascending:false
}
);

const list =
document
.getElementById(
"certificatesList"
);

list.innerHTML = "";

data.forEach(cert=>{

list.innerHTML += `

<div class="certificate-card">

<img
src="${cert.image_url}">

<h3>
${cert.created_name}
</h3>

<p>
${cert.description}
</p>

<br>

<button
class="danger-btn"
onclick="deleteCertificate(
${cert.id}
)">

Delete

</button>

</div>

`;

});

}

/* ==========================
   INITIAL LOAD
========================== */

loadProfile();
loadAbout();
loadSkills();
loadProjects();
loadCertificates();

</script>

</body>
</html>
